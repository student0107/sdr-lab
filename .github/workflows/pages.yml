# Публикация статического сайта на GitHub Pages (только файлы из репозитория; .gitignore скрывает dev-папки)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Yandex Maps API key (GitHub Secret)
        env:
          YANDEX_MAP_API_KEY: ${{ secrets.YANDEX_MAP_API_KEY }}
        run: |
          if [ -n "$YANDEX_MAP_API_KEY" ]; then
            node -e "const fs=require('fs');const k=process.env.YANDEX_MAP_API_KEY;fs.writeFileSync('map-api-config.local.js','window.SDR_LAB_YANDEX_API_KEY='+JSON.stringify(k)+';\\n');"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
